[package]
name = "birta-core"
version = "0.2.0"
edition = "2024"
description = "Markdown rendering, syntax highlighting, themes and stylesheets behind birta"
license = "MIT"
repository = "https://github.com/hugvit/birta"
readme = "README.md"
keywords = ["markdown", "github", "themes", "syntax-highlighting"]
categories = ["text-processing"]

[dependencies]
anyhow = "1"
comrak = { version = "0.51", default-features = false, features = ["shortcodes", "syntect"] }
serde = { version = "1", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["plist-load", "html"] }
toml = "0.8"
yaml-rust2 = "0.13.2"
